[package]
name = "opsdeck"
version = "0.3.0"
edition = "2024"
default-run = "opsdeck"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = "0.35"
reqwest = { version = "0.13", features = ["blocking"] }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"